<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>• ๔คภภเкคร ฬгl๔ •</title>
  <meta name="description" content="her hub ✿ classes, links, and vibes">
  <!-- personal hub: keep it out of search engines -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#150e26">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23b48ef0'/%3E%3Ctext x='32' y='40' font-size='22' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='%23150e26'%3E999%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/vibes.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <header class="top wrap">
    <div>
      <p class="greeting" id="greeting">hi ✿</p>
      <h1 class="title" aria-label="dannika's world">• ๔คภภเкคร ฬгl๔ •</h1>
    </div>
    <div class="clock">
      <span class="clock-time" id="clock-time">--:--</span>
      <span class="clock-date" id="clock-date"></span>
      <span class="day-badge" id="day-badge"></span>
    </div>
  </header>

  <main class="wrap">
    <!-- RIGHT NOW: filled in by js/app.js from data/schedule.js -->
    <section class="now card" id="now" aria-live="polite"></section>

    <nav class="switcher" aria-label="switch class">
      <p class="label">switch class</p>
      <div class="chips" id="class-chips"></div>
    </nav>

    <div class="grid">
      <section class="card" aria-labelledby="today-title">
        <h2 id="today-title">today</h2>
        <ol class="timeline" id="today-list"></ol>
      </section>

      <section class="card" aria-labelledby="links-title">
        <h2 id="links-title">quick links</h2>
        <div class="links" id="links"></div>
      </section>

      <section class="card" aria-labelledby="todo-title">
        <h2 id="todo-title">little list</h2>
        <form class="todo-form" id="todo-form" autocomplete="off">
          <input id="todo-input" type="text" placeholder="add something…" aria-label="new to-do" maxlength="140">
          <button class="btn" type="submit">add</button>
        </form>
        <ul class="todo-list" id="todo-list"></ul>
      </section>

      <section class="card" aria-labelledby="week-title">
        <h2 id="week-title">this week</h2>
        <div class="week-grid" id="week"></div>
        <ul class="coming-up" id="coming-up" aria-label="coming up"></ul>
      </section>
    </div>

    <!-- =====================================================================
         VIBES — shows + music
         OWNED BY: the "vibes" LLM. Read LLM_INSTRUCTIONS.md first.
         - Put content in data/vibes.js, rendering in js/vibes.js, styles in css/vibes.css.
         - You may change anything INSIDE this <section>. Don't edit outside it.
         ===================================================================== -->
    <section class="vibes card" id="vibes" aria-labelledby="vibes-title">
      <h2 id="vibes-title">vibes ✿ shows &amp; music</h2>
      <div id="vibes-root"></div>
    </section>
    <!-- ======================= END VIBES ================================== -->
  </main>

  <footer class="foot">
    <span class="nine">999</span>
    <span>legends never die ✿ made with love, just for you</span>
  </footer>

  <!-- plain scripts (no modules) so this also works when opened straight from a folder -->
  <script src="data/settings.js"></script>
  <script src="data/schedule.js"></script>
  <script src="data/vibes.js"></script>
  <script src="js/app.js"></script>
  <script src="js/vibes.js"></script>
</body>
</html>
